name: Feature request
description: Something Portside should be able to do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The task, not the feature. "I want to keep old and new servers apart in
        the tab bar" leads somewhere better than "add drag to reorder" — there
        may be a shape that fits Portside better than the one you had in mind.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In Portside, or in whatever you used before it.
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >
        Screenshots, how another tool handles it, or why the obvious approach
        wouldn't work for you.

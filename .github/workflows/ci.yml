name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    # A normal run takes about 7 minutes. A test that deadlocks should fail
    # the build quickly, not hold the runner for GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The live terminal suite (TerminalLive*Tests) runs real tmux and skips
      # without it; vim ships with macOS. Installed so CI runs it rather than
      # skipping it — the suite is the thing standing between a SwiftTerm bump
      # and a regression nobody notices.
      # SwiftTerm 2 needs Swift 6.2 (swift-tools-version 6.2), newer than
      # the image's default Xcode. Pick the newest Xcode 26 installed.
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          swift --version
      - name: Install tmux and neovim
        run: brew install tmux neovim vttest
      # Publishing commits with the user's own git identity and refuses to
      # guess one (user.useConfigOnly). Without this every publish-flow test
      # failed to create its inventory — and, until they were made to fail,
      # skipped silently.
      - name: Git identity for publish tests
        run: |
          git config --global user.name "Portside CI"
          git config --global user.email "ci@portside.invalid"
      # Restores the last build for this toolchain and dependency set, so a
      # run recompiles what changed instead of everything, dependencies
      # (SwiftTerm and the rest) included. Keyed on the compiler, so a new
      # Xcode on the runner image starts clean rather than mixing modules
      # from two compilers. A PR can read main's cache; main's own runs keep
      # it current.
      - name: Toolchain fingerprint
        id: toolchain
        run: echo "hash=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: .build
          key: build-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.resolved') }}-
      # Under `script`, so the tests see a terminal and their output is line
      # buffered. Piped, XCTest's output is block buffered: a run that hung
      # showed a log ending somewhere before the test that was stuck, and
      # three runs were spent guessing which. `script` passes the exit
      # status through, so failures still fail the step.
      - name: Build and test
        run: script -q /dev/null swift test < /dev/null
      # Per-file ratchet on the Swift 6 migration. The package is still on
      # swift-tools 5.9, so these are warnings rather than errors — the gate
      # is that the count must not grow while the migration is pending.
      # See Scripts/strict-concurrency-check.sh.
      - name: Swift 6 strict concurrency ratchet
        run: Scripts/strict-concurrency-check.sh
      - name: Verify bundled themes resource
        run: |
          python3 - <<'EOF'
          import json
          themes = json.load(open("Sources/Portside/Resources/BundledThemes.json"))
          assert len(themes) >= 30, f"expected >=30 themes, got {len(themes)}"
          for t in themes:
              assert len(t["ansi"]) == 16, f"{t['name']}: ansi palette must have 16 entries"
              for key in ("foreground", "background", "cursor"):
                  assert t[key].startswith("#") and len(t[key]) == 7, f"{t['name']}: bad {key}"
          print(f"OK: {len(themes)} themes validated")
          EOF

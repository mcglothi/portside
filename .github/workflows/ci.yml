name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        run: swift test
      # Per-file ratchet on the Swift 6 migration. The package is still on
      # swift-tools 5.9, so these are warnings rather than errors — the gate
      # is that the count must not grow while the migration is pending.
      # See Scripts/strict-concurrency-check.sh.
      - name: Swift 6 strict concurrency ratchet
        run: Scripts/strict-concurrency-check.sh
      - name: Verify bundled themes resource
        run: |
          python3 - <<'EOF'
          import json
          themes = json.load(open("Sources/Portside/Resources/BundledThemes.json"))
          assert len(themes) >= 30, f"expected >=30 themes, got {len(themes)}"
          for t in themes:
              assert len(t["ansi"]) == 16, f"{t['name']}: ansi palette must have 16 entries"
              for key in ("foreground", "background", "cursor"):
                  assert t[key].startswith("#") and len(t[key]) == 7, f"{t['name']}: bad {key}"
          print(f"OK: {len(themes)} themes validated")
          EOF
